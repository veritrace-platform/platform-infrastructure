version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /simulator
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /simulator
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: build

  - package-ecosystem: uv
    directory: /demo
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /demo
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: build
