# Local development broker. See docs/contracts/messaging.md §1.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S

listener 1883
protocol mqtt

# The ingest subscription acknowledges a reading only after Kafka has it, so readings that devices upload in a burst,
# such as a backlog after an outage, queue at the broker. The default queue of 1000 messages per client drops the
# rest; 50 000 readings take about 10 MB.
max_queued_messages 50000

allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
