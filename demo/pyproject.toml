[project]
name = "veritrace-demo"
version = "0.1.0"
description = "Demonstration kit: seeds demo companies through the APIs and runs the M1 acceptance scenario"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "websockets>=15",
    "veritrace-simulator",
]

[project.scripts]
veritrace-demo = "veritrace_demo.cli:main"

[tool.uv.sources]
veritrace-simulator = { path = "../simulator" }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]
# Ranges such as 2–8 °C are written with an en dash, as in the documentation.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
