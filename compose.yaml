name: veritrace

# Local development environment. See docs/adr/0019-local-development-environment.md.
# Default profile: infrastructure dependencies and the gateway.
# Profile "apps": Go services built from sibling repositories.
# Profile "tools": developer tooling (Kafka UI).
# Profile "tunnel": temporary public HTTPS URL for testing on phones (Cloudflare quick tunnel).
#
# Ports bind to 127.0.0.1 only, containers restart on crashes but not when Docker starts, and memory is
# capped per container so the stack never takes over the workstation.

x-restart: &restart
  restart: on-failure:3

services:
  postgres:
    <<: *restart
    image: timescale/timescaledb:2.30.1-pg18
    mem_limit: 1g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      TIMESCALEDB_TELEMETRY: "off"
      NO_TS_TUNE: "true"
      VERITRACE_CORE_OWNER_PASSWORD: ${VERITRACE_CORE_OWNER_PASSWORD:?}
      VERITRACE_CORE_APP_PASSWORD: ${VERITRACE_CORE_APP_PASSWORD:?}
      VERITRACE_TELEMETRY_OWNER_PASSWORD: ${VERITRACE_TELEMETRY_OWNER_PASSWORD:?}
      VERITRACE_TELEMETRY_APP_PASSWORD: ${VERITRACE_TELEMETRY_APP_PASSWORD:?}
      VERITRACE_RELAYER_OWNER_PASSWORD: ${VERITRACE_RELAYER_OWNER_PASSWORD:?}
      VERITRACE_RELAYER_APP_PASSWORD: ${VERITRACE_RELAYER_APP_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veritrace_core"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    <<: *restart
    image: apache/kafka:4.3.1
    mem_limit: 1g
    environment:
      CLUSTER_ID: VnRyYWNlTG9jYWxEZXYwMQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.3.1
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  mosquitto:
    <<: *restart
    image: eclipse-mosquitto:2.0.22
    mem_limit: 64m
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_INGEST_PASSWORD: ${MQTT_INGEST_PASSWORD:?}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:?}
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u telemetry-ingest -P \"$$MQTT_INGEST_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *restart
    image: redis:8.8.3-alpine
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    <<: *restart
    image: caddy:2.11.4-alpine
    mem_limit: 128m
    environment:
      CORE_UPSTREAM: ${GATEWAY_CORE_UPSTREAM:-host.docker.internal:8080}
      TELEMETRY_UPSTREAM: ${GATEWAY_TELEMETRY_UPSTREAM:-host.docker.internal:8090}
      RELAYER_UPSTREAM: ${GATEWAY_RELAYER_UPSTREAM:-host.docker.internal:8100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8000}:8000"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro

  # --- profile: apps -------------------------------------------------------

  core-business-service-migrate:
    profiles: ["apps"]
    image: veritrace/core-business-service:dev
    mem_limit: 128m
    build: ../core-business-service
    command: ["migrate", "up"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://veritrace_core_owner:${VERITRACE_CORE_OWNER_PASSWORD}@postgres:5432/veritrace_core?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  core-business-service:
    <<: *restart
    profiles: ["apps"]
    image: veritrace/core-business-service:dev
    mem_limit: 256m
    build: ../core-business-service
    command: ["serve"]
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      ADMIN_ADDR: ":8081"
      DATABASE_URL: postgres://veritrace_core_app:${VERITRACE_CORE_APP_PASSWORD}@postgres:5432/veritrace_core?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      core-business-service-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/core-business-service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  telemetry-stream-service-migrate:
    profiles: ["apps"]
    image: veritrace/telemetry-stream-service:dev
    mem_limit: 128m
    build: ../telemetry-stream-service
    command: ["migrate", "up"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://veritrace_telemetry_owner:${VERITRACE_TELEMETRY_OWNER_PASSWORD}@postgres:5432/veritrace_telemetry?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  telemetry-stream-service:
    <<: *restart
    profiles: ["apps"]
    image: veritrace/telemetry-stream-service:dev
    mem_limit: 256m
    build: ../telemetry-stream-service
    command: ["serve"]
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      HTTP_ADDR: ":8090"
      ADMIN_ADDR: ":8091"
      DATABASE_URL: postgres://veritrace_telemetry_app:${VERITRACE_TELEMETRY_APP_PASSWORD}@postgres:5432/veritrace_telemetry?sslmode=disable
    ports:
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:8091:8091"
    depends_on:
      telemetry-stream-service-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/telemetry-stream-service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  # --- profile: tools ------------------------------------------------------

  kafka-ui:
    <<: *restart
    profiles: ["tools"]
    image: ghcr.io/kafbat/kafka-ui:v1.1.0
    mem_limit: 512m
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # --- profile: tunnel -----------------------------------------------------

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.9.3
    mem_limit: 128m
    command: ["tunnel", "--no-autoupdate", "--url", "${TUNNEL_TARGET:-http://gateway:8000}"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

volumes:
  postgres-data:
  kafka-data:
  mosquitto-data:
  redis-data:
